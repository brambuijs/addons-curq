# This file is adapted from the 16.0 branch.
# It points the 'upstream' servers to the Docker
# service name 'web' and includes the closing '}'.

upstream odoo {
 # MODIFIED: Changed 127.0.0.1 to 'web' (the Docker service name)
 server web:8069;
}

upstream odoochat {
 # MODIFIED: Changed 127.0.0.1 to 'web' (the Docker service name)
 server web:8072;
}

server {
    listen 80;

    # TODO: Add your domain name
    # server_name your_domain.com;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Proxy headers
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # Odoo web application
    location / {
      proxy_redirect off;
      proxy_pass http://odoo;
    }

    # Odoo longpolling
    location /longpolling {
      proxy_pass http://odoochat;
    }

    # Gzip
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript;
    gzip on;

    # Cache static files
    location ~* /web/static/ {
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 864000;
        proxy_pass http://odoo;
    }
}
